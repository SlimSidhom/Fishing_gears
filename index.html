<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--page:start-->
<title>Emeraldas Air Reel Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: the reel owns the whole screen; a title block floats top-left and one
   panel (right column on desktop, bottom sheet on phones) holds detail, parts, view controls. */
:root {
  --stage-a: #f1f5f3;
  --stage-b: #bfcdc7;
  --surface: rgba(249, 252, 250, .88);
  --surface-solid: #f9fcfa;
  --ink: #10201c;
  --muted: #4d615a;
  --line: rgba(16, 32, 28, .15);
  --accent: #0a8a66;
  --accent-ink: #ffffff;
  --accent-soft: rgba(10, 138, 102, .12);
  --pin-bg: #10201c;
  --halo: #eef3f0;
  --pin-ink: #f1f5f3;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Barlow", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage-a: #3a4d47; --stage-b: #0a100f;
    --surface: rgba(15, 23, 21, .84); --surface-solid: #0f1715;
    --ink: #e7f0ec; --muted: #9fb2ab; --line: rgba(231, 240, 236, .16);
    --accent: #2fd3a2; --accent-ink: #04241a; --accent-soft: rgba(47, 211, 162, .14);
    --pin-bg: #e7f0ec; --pin-ink: #0f1715; --halo: #0a100f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage-a: #3a4d47; --stage-b: #0a100f;
  --surface: rgba(15, 23, 21, .84); --surface-solid: #0f1715;
  --ink: #e7f0ec; --muted: #9fb2ab; --line: rgba(231, 240, 236, .16);
  --accent: #2fd3a2; --accent-ink: #04241a; --accent-soft: rgba(47, 211, 162, .14);
  --pin-bg: #e7f0ec; --pin-ink: #0f1715; --halo: #0a100f;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--stage-b);
  color: var(--ink);
  font: 400 15px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  position: fixed; inset: 0;
  background: radial-gradient(ellipse 75% 70% at 42% 45%, var(--stage-a), var(--stage-b));
  overflow: hidden;
}
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#stage.is-dragging { cursor: grabbing; }
#stage.is-over { cursor: pointer; }

/* Title block */
.title {
  position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); left: var(--gutter-l);
  max-width: min(520px, calc(100% - 380px));
  pointer-events: none;
  text-shadow: 0 0 6px var(--halo), 0 0 14px var(--halo), 0 0 22px var(--halo);
}
.eyebrow {
  margin: 0; font: 600 13px/1 var(--font-display);
  letter-spacing: .16em; text-transform: uppercase; color: var(--accent);
}
h1 {
  margin: 6px 0 0; font: 700 clamp(26px, 3.4vw, 44px)/.98 var(--font-display);
  letter-spacing: .005em; text-transform: uppercase; text-wrap: balance;
}
h1 small { display: block; font-size: .55em; font-weight: 500; letter-spacing: .08em; color: var(--muted); margin-top: 4px; }
.specs {
  display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 14px 0 0; padding: 0; list-style: none;
  font-variant-numeric: tabular-nums;
}
.specs li { display: flex; flex-direction: column; }
.specs b { font: 600 20px/1.05 var(--font-display); }
.specs span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Pins */
.pins { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pin {
  position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px;
  border-radius: 50%; border: 1.5px solid var(--pin-ink); padding: 0;
  background: var(--pin-bg); color: var(--pin-ink);
  font: 600 12px/1 var(--font-display); font-variant-numeric: tabular-nums;
  pointer-events: auto; cursor: pointer;
  transition: opacity .2s, background-color .15s, scale .15s;
  will-change: transform;
}
.pin:hover { scale: 1.2; }
.pin.is-occluded { opacity: 0; pointer-events: none; }
.pin.is-selected { background: var(--accent); color: var(--accent-ink); border-color: var(--accent-ink); scale: 1.25; opacity: 1; pointer-events: auto; }
.tip {
  position: absolute; left: 0; top: 0; pointer-events: none;
  background: var(--pin-bg); color: var(--pin-ink);
  font: 600 13px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase;
  padding: 6px 9px; border-radius: 4px; white-space: nowrap;
}

/* Panel */
.panel {
  position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: var(--gutter-r);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 330px; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  overflow: hidden;
}
.detail { padding: 18px 18px 16px; border-bottom: 1px solid var(--line); min-width: 0; }
.detail .kicker { margin: 0; font: 600 12px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.detail h2 { margin: 6px 0 0; font: 600 26px/1.05 var(--font-display); text-transform: uppercase; text-wrap: balance; }
.detail p { margin: 10px 0 0; color: var(--muted); }
.detail p.lead { color: var(--ink); }
.facts { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-variant-numeric: tabular-nums; }
.facts dt { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.facts dd { margin: 0; font-weight: 500; }

.parts { flex: 1 1 auto; min-height: 0; overflow-y: auto; margin: 0; padding: 8px; list-style: none; display: flex; flex-direction: column; gap: 2px; }
.parts .group { padding: 10px 10px 4px; font: 600 11px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.part {
  width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
  padding: 7px 10px; border: 0; border-radius: 6px; background: transparent; cursor: pointer;
}
.part:hover { background: var(--accent-soft); }
.part .n {
  flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid var(--line); font: 600 12px/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--muted);
}
.part .name { min-width: 0; font-weight: 500; }
.part[aria-current="true"] { background: var(--accent-soft); }
.part[aria-current="true"] .n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.controls { border-top: 1px solid var(--line); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.btn {
  flex: 1 1 auto; padding: 8px 10px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: transparent;
  font: 600 13px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.slider { display: flex; align-items: center; gap: 12px; }
.slider label { font: 600 13px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; }
.slider input { flex: 1; min-width: 0; accent-color: var(--accent); }
.note { margin: 0; font-size: 11.5px; line-height: 1.35; color: var(--muted); }
.fail { position: absolute; inset: 40% var(--gutter-r) auto var(--gutter-l); text-align: center; color: var(--muted); }

@media (max-width: 760px) {
  .title { max-width: none; right: var(--gutter-r); top: calc(12px + env(safe-area-inset-top, 0px)); }
  h1 { font-size: 26px; }
  .specs { margin-top: 8px; gap: 4px 14px; }
  .specs b { font-size: 16px; }
  .specs span { font-size: 10px; }
  .panel {
    top: auto; left: var(--gutter-l); width: auto; max-height: 47%;
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .detail { padding: 12px 14px; overflow-y: auto; flex: 0 1 auto; min-height: 64px; }
  .detail h2 { font-size: 21px; }
  .detail p { margin-top: 6px; font-size: 14px; }
  .facts { margin-top: 8px; }
  .parts { flex: none; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 8px; gap: 4px; }
  .parts .group { display: none; }
  .part { width: auto; flex: none; padding: 6px 10px 6px 6px; border: 1px solid var(--line); white-space: nowrap; }
  .controls { padding: 8px 10px 10px; gap: 8px; }
  .row { grid-template-columns: repeat(4, auto); }
  .btn { padding: 8px 6px; letter-spacing: .04em; }
  .note { display: none; }
}
@media (prefers-reduced-motion: reduce) { .pin { transition: none; } }
</style>
<!--page:head-end-->
</head>
<body>
<!--page:body-start-->
<div class="app" id="app">
  <canvas id="stage" aria-label="Interactive 3D model of the reel. Use the parts list to move the camera to a component."></canvas>
  <div class="pins" id="pins"></div>
  <div class="tip" id="tip" hidden></div>

  <header class="title">
    <p class="eyebrow">Daiwa &middot; eging spinning reel</p>
    <h1>Emeraldas Air <small>PC LT2500-H &middot; 2025</small></h1>
    <ul class="specs" aria-label="Key specifications">
      <li><b>175 g</b><span>Weight</span></li>
      <li><b>5.7 : 1</b><span>Gear ratio</span></li>
      <li><b>80 cm</b><span>Per handle turn</span></li>
      <li><b>10 kg</b><span>Max drag</span></li>
      <li><b>12 + 1</b><span>Bearings</span></li>
    </ul>
  </header>

  <aside class="panel" id="panel" aria-label="Reel parts">
    <section class="detail" id="detail" aria-live="polite"></section>
    <ul class="parts" id="parts"></ul>
    <div class="controls">
      <div class="row">
        <button class="btn" id="btn-home" type="button">Whole reel</button>
        <button class="btn" id="btn-spin" type="button" aria-pressed="false">Turn handle</button>
        <button class="btn" id="btn-xray" type="button" aria-pressed="false">X-ray</button>
        <button class="btn" id="btn-pins" type="button" aria-pressed="true">Labels</button>
      </div>
      <div class="slider">
        <label for="explode">Explode</label>
        <input id="explode" type="range" min="0" max="100" value="0">
      </div>
      <p class="note">Stylised model built from primitives, not Daiwa CAD. Proportions are approximate. Not affiliated with Daiwa.</p>
    </div>
  </aside>
</div>

<script src="vendor/three.min.js"></script>
<script>
(function () {
'use strict';
var T = window.THREE;
var canvas = document.getElementById('stage');
var app = document.getElementById('app');
var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ------------------------------------------------------------------ data */
var INFO = {
  spool: {
    name: 'Spool', role: 'Line storage',
    text: 'A shallow 2500-size spool for thin braid, the standard for casting egi (squid jigs). The long, smooth front lip lets coils leave with little friction, and the skirt at the back slides over the rotor as the spool moves in and out.',
    facts: [['Capacity', 'PE 0.8 – 200 m'], ['Size', 'LT 2500'], ['Family', 'Airdrive spool']],
    view: [1.05, 1.2]
  },
  drag: {
    name: 'Drag knob', role: 'Front drag',
    text: 'Turning the knob squeezes a stack of washers inside the spool. Eging needs a drag that slips smoothly on every sharp jerk of the rod and when a squid surges, so the line and the soft catch of the hooks survive.',
    facts: [['Max drag', '10 kg'], ['Position', 'Front, on the spool']],
    view: [1.4, 1.25]
  },
  rotor: {
    name: 'Rotor', role: 'Winds the line',
    text: 'The rotor spins around the spool and carries the bail. Each handle turn takes it round 5.7 times. A light rotor starts and stops quickly, which makes the reel feel sensitive between jerks. Daiwa groups this rotor under its Airdrive design.',
    facts: [['Speed', '5.7 turns per handle turn'], ['Retrieve', '80 cm per handle turn'], ['Family', 'Airdrive rotor']],
    view: [0.55, 1.15]
  },
  bail: {
    name: 'Bail arm', role: 'Opens for the cast',
    text: 'The wire loop flips open to release line for a cast and snaps shut to catch it again, guiding the line down to the roller. A thin, light bail keeps the rotor balanced as it spins.',
    facts: [['Family', 'Airdrive bail']],
    view: [1.0, 0.95]
  },
  roller: {
    name: 'Line roller', role: 'Line contact point',
    text: 'The only place the line touches the reel under load. The roller turns on a bearing so braid passes over it without twisting or wearing. It is the part most worth rinsing after saltwater.',
    facts: [['Bearing', '1 roller bearing']],
    view: [0.75, 1.0]
  },
  body: {
    name: 'Body', role: 'Gear housing',
    text: 'The body holds the drive gear, pinion and oscillation parts in a rigid shell. A stiff, light housing keeps the gears aligned under drag pressure. Total reel weight is 175 g.',
    facts: [['Reel weight', '175 g'], ['Concept', 'LT (light, tough)']],
    view: [0.55, 1.3]
  },
  foot: {
    name: 'Stem and foot', role: 'Mounts to the rod',
    text: 'The foot slides into the rod’s reel seat and the stem carries the reel below the blank. The cut-out in the stem saves weight where it is not needed for stiffness.',
    facts: [['Fits', 'Standard spinning reel seat']],
    view: [0.6, 1.2]
  },
  handle: {
    name: 'Handle', role: 'Drives the gears',
    text: 'A single machined arm that screws straight into the drive gear, so there is no play between hand and gear. The H in the model name marks the high-speed 5.7 : 1 ratio.',
    facts: [['Length', '55 mm'], ['Gear ratio', '5.7 : 1'], ['Side', 'Swappable left / right']],
    view: [0.35, 1.35]
  },
  knob: {
    name: 'Handle knob', role: 'Grip',
    text: 'A slim knob that is easy to find without looking and comfortable to pinch through long sessions of repeated jerks and fast slack recovery.',
    facts: [['Mount', 'On bearings, turns freely']],
    view: [0.5, 1.3]
  },
  plate: {
    name: 'Side plate', role: 'Closes the gear box',
    text: 'A round plate screws into the body opposite the handle and supports one end of the drive gear. Remove the handle cap on this side to move the handle across for right-hand winding.',
    facts: [['Side', 'Opposite the handle']],
    view: [Math.PI + 0.55, 1.35]
  },
  gear: {
    name: 'Drive gear', role: 'Internal · main gear', internal: true,
    text: 'The large gear turned directly by the handle. Its face teeth mesh with the pinion and set the 5.7 : 1 ratio. Daiwa supports this gear on two stainless ball bearings.',
    facts: [['Ratio', '5.7 : 1'], ['Support', '2 ball bearings']],
    view: [Math.PI + 0.7, 1.2]
  },
  pinion: {
    name: 'Pinion gear', role: 'Internal · turns the rotor', internal: true,
    text: 'A small hollow gear on the reel’s centre line. The drive gear spins it, it spins the rotor, and the main shaft slides through its middle. It also runs on two stainless ball bearings.',
    facts: [['Support', '2 ball bearings']],
    view: [Math.PI + 0.9, 1.1]
  },
  shaft: {
    name: 'Main shaft', role: 'Internal · carries the spool', internal: true,
    text: 'The shaft runs from the back of the body through the pinion to the spool. It does not rotate. It moves forward and back as you wind, which lays line evenly across the spool.',
    facts: [['Motion', 'Oscillates with each retrieve'], ['Family', 'Airdrive shaft']],
    view: [Math.PI + 0.9, 1.15]
  },
  bearings: {
    name: 'Bearings', role: 'Internal · 12 ball + 1 roller', internal: true,
    text: 'Twelve ball bearings and one roller bearing support every rotating part. Four of them are shown here: two on the pinion and two on the drive gear.',
    facts: [['Ball bearings', '12'], ['Roller bearings', '1']],
    view: [Math.PI + 0.8, 1.15]
  }
};
var ORDER = ['spool', 'drag', 'rotor', 'bail', 'roller', 'body', 'foot', 'handle', 'knob', 'plate', 'gear', 'pinion', 'shaft', 'bearings'];

/* -------------------------------------------------------------- renderer */
var renderer;
try {
  renderer = new T.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
} catch (err) {
  var f = document.createElement('p');
  f.className = 'fail';
  f.textContent = 'This browser could not start WebGL, so the 3D model cannot be shown.';
  app.appendChild(f);
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

var scene = new T.Scene();
var camera = new T.PerspectiveCamera(32, 1, 0.1, 400);

/* Studio environment, generated in code so the page needs no image files. */
(function buildEnvironment() {
  var env = new T.Scene();
  var c = document.createElement('canvas'); c.width = 4; c.height = 128;
  var g = c.getContext('2d');
  var grad = g.createLinearGradient(0, 0, 0, 128);
  grad.addColorStop(0, '#f4faf7'); grad.addColorStop(0.45, '#9fb0aa'); grad.addColorStop(0.55, '#3b4a46'); grad.addColorStop(1, '#0c1211');
  g.fillStyle = grad; g.fillRect(0, 0, 4, 128);
  var tex = new T.CanvasTexture(c); tex.colorSpace = T.SRGBColorSpace;
  env.add(new T.Mesh(new T.SphereGeometry(60, 32, 16), new T.MeshBasicMaterial({ map: tex, side: T.BackSide })));
  function panel(w, h, x, y, z, k) {
    var m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: new T.Color(k, k, k * 0.98), side: T.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
  }
  panel(40, 14, 0, 34, 6, 7);
  panel(10, 40, 34, 8, 20, 5);
  panel(8, 36, -36, 4, 10, 3.5);
  panel(30, 6, 0, 2, -38, 3);
  panel(14, 14, 10, -30, 24, 1.2);
  var pm = new T.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.03).texture;
  pm.dispose();
})();
scene.add(new T.HemisphereLight(0xffffff, 0x1b2422, 0.55));
var key = new T.DirectionalLight(0xffffff, 1.4); key.position.set(8, 14, 12); scene.add(key);

/* ------------------------------------------------------------- materials */
function std(color, metal, rough, extra) {
  var o = { color: color, metalness: metal, roughness: rough, side: T.DoubleSide };
  if (extra) for (var k in extra) o[k] = extra[k];
  return new T.MeshStandardMaterial(o);
}
var MAT = {
  satin: function () { return std(0x191c1e, 0.55, 0.42); },
  gloss: function () { return std(0x0c0e0f, 0.85, 0.2); },
  emerald: function () { return std(0x0fae7f, 0.95, 0.24); },
  silver: function () { return std(0xd3dadc, 1, 0.2); },
  champagne: function () { return std(0xc9a765, 1, 0.26); },
  steel: function () { return std(0x9aa3a6, 1, 0.32); },
  brass: function () { return std(0xb8924a, 1, 0.34); },
  eva: function () { return std(0x1b1b1c, 0, 0.95); }
};
function lineMaterial() {
  var c = document.createElement('canvas'); c.width = 4; c.height = 64;
  var g = c.getContext('2d');
  for (var i = 0; i < 64; i++) { g.fillStyle = (i % 8 < 4) ? '#ffffff' : '#bdbdbd'; g.fillRect(0, i, 4, 1); }
  var t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(1, 9);
  return std(0xd3ea4f, 0, 0.8, { map: t, bumpMap: t, bumpScale: 0.6 });
}

/* ------------------------------------------------------ geometry helpers */
function latheX(pts, seg) {            // profile as [along-axis, radius], axis = +X
  var g = new T.LatheGeometry(pts.map(function (p) { return new T.Vector2(p[1], p[0]); }), seg || 72);
  g.rotateZ(-Math.PI / 2); return g;
}
function latheZ(pts, seg) {            // axis = +Z
  var g = new T.LatheGeometry(pts.map(function (p) { return new T.Vector2(p[1], p[0]); }), seg || 48);
  g.rotateX(Math.PI / 2); return g;
}
function cylX(r, a, b, seg) { var g = new T.CylinderGeometry(r, r, b - a, seg || 40); g.rotateZ(-Math.PI / 2); g.translate((a + b) / 2, 0, 0); return g; }
function cylZ(r, a, b, seg) { var g = new T.CylinderGeometry(r, r, b - a, seg || 40); g.rotateX(Math.PI / 2); g.translate(0, 0, (a + b) / 2); return g; }
function extrude(shape, depth, bevel, steps) {
  var g = new T.ExtrudeGeometry(shape, { depth: depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: steps || 4, curveSegments: 28 });
  g.translate(0, 0, -depth / 2); return g;
}
function poly(pts) { var s = new T.Shape(); pts.forEach(function (p, i) { if (i) s.lineTo(p[0], p[1]); else s.moveTo(p[0], p[1]); }); s.closePath(); return s; }
function polyPath(pts) { var s = new T.Path(); pts.forEach(function (p, i) { if (i) s.lineTo(p[0], p[1]); else s.moveTo(p[0], p[1]); }); s.closePath(); return s; }
function mesh(parent, geo, mat, pos, rot) {
  var m = new T.Mesh(geo, mat);
  if (pos) m.position.set(pos[0], pos[1], pos[2]);
  if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
  parent.add(m); return m;
}

/* ----------------------------------------------------------------- parts */
var root = new T.Group(); scene.add(root);
var P = {};
function part(id, parent, ex, flags) {
  var g = new T.Group(); g.name = id; parent.add(g);
  P[id] = { id: id, g: g, ex: new T.Vector3(ex[0], ex[1], ex[2]), meshes: [], anchor: null, base: null,
            shell: !!(flags && flags.shell), internal: !!INFO[id].internal };

/* ---------------------------------------------------------------- camera */
var cur = { target: new T.Vector3(), r: 30, theta: 0.75, phi: 1.25 };
var goal = { target: new T.Vector3(), r: 30, theta: 0.75, phi: 1.25 };
var home = { target: new T.Vector3(), r: 30, theta: 0.75, phi: 1.25 };
var R_MIN = 2.2, R_MAX = 80;
var view = { w: 1, h: 1, offX: 0, offY: 0, fx: 1, fy: 1 };
var box = new T.Box3(), sph = new T.Sphere(), v3 = new T.Vector3();

function partBox(id) {
  box.makeEmpty();
  P[id].meshes.forEach(function (m) { box.expandByObject(m); });
  return box;
}
function fitRadius(radius) {
  var half = camera.fov * Math.PI / 360;
  var t = Math.tan(half);   // usable area is the part of the screen the panel and title leave free
  return radius / Math.sin(Math.min(Math.atan(t * view.fy), Math.atan(t * view.fx)));
}
function nearestAngle(a, ref) { return a + Math.PI * 2 * Math.round((ref - a) / (Math.PI * 2)); }
function computeHome() {
  box.makeEmpty();
  pickables.forEach(function (m) { box.expandByObject(m); });
  box.getBoundingSphere(sph);
  home.target.copy(sph.center);
  home.r = Math.min(R_MAX, fitRadius(sph.radius * 0.86));
}
function goHome(instant) {
  computeHome();
  goal.target.copy(home.target); goal.r = home.r;
  goal.theta = nearestAngle(home.theta, cur.theta); goal.phi = home.phi;
  if (instant) snap();
}
function snap() { cur.target.copy(goal.target); cur.r = goal.r; cur.theta = goal.theta; cur.phi = goal.phi; }
function flyTo(id) {
  partBox(id).getBoundingSphere(sph);
  goal.target.copy(sph.center);
  goal.r = Math.max(7, Math.min(R_MAX, fitRadius(sph.radius * 1.7)));
  var pv = INFO[id].view;
  goal.theta = nearestAngle(pv[0], cur.theta); goal.phi = pv[1];
}
function applyCamera() {
  var sp = Math.sin(cur.phi);
  camera.position.set(cur.target.x + cur.r * sp * Math.sin(cur.theta), cur.target.y + cur.r * Math.cos(cur.phi), cur.target.z + cur.r * sp * Math.cos(cur.theta));
  camera.lookAt(cur.target);
  camera.updateMatrixWorld();
}
function resize() {
  var w = app.clientWidth, h = app.clientHeight;
  if (!w || !h) return;
  var pr = document.getElementById('panel').getBoundingClientRect(), ar = app.getBoundingClientRect();
  var tr = document.querySelector('.title').getBoundingClientRect();
  view.w = w; view.h = h; view.offX = 0; view.offY = 0;
  var freeW = w, freeH = h;
  if (pr.height > h * 0.6) {                       // side panel
    freeW = Math.max(200, pr.left - ar.left); view.offX = (w - freeW) / 2;
  } else {                                          // bottom sheet, title on top
    var top = tr.bottom - ar.top, bottom = pr.top - ar.top;
    freeH = Math.max(160, bottom - top); view.offY = (h - (top + bottom)) / 2;
  }
  view.fx = freeW / h; view.fy = freeH / h;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.setViewOffset(w, h, view.offX, view.offY, w, h);
  camera.updateProjectionMatrix();
}

/* ------------------------------------------------------------ interaction */
var raycaster = new T.Raycaster(), ndc = new T.Vector2();
var state = { selected: null, hover: null, xray: false, spin: false, pins: true, explode: 0, angle: 0 };

function visiblePick(m) { return !(state.xray && P[m.userData.part].shell); }
function pickAt(clientX, clientY) {
  var r = canvas.getBoundingClientRect();
  ndc.set((clientX - r.left) / r.width * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  var hits = raycaster.intersectObjects(pickables, false);
  for (var i = 0; i < hits.length; i++) if (visiblePick(hits[i].object)) return hits[i];
  return null;
}
function paint() {
  ORDER.forEach(function (id) {
    var p = P[id], hex = id === state.selected ? 0x053425 : (id === state.hover ? 0x03241a : 0x000000);
    var ghost = state.xray && p.shell;
    p.meshes.forEach(function (m) {
      m.material.emissive.setHex(hex);
      m.material.transparent = ghost; m.material.opacity = ghost ? 0.13 : 1; m.material.depthWrite = !ghost;
      m.renderOrder = ghost ? 2 : 0;
    });
  });
}
function setXray(on) {
  state.xray = on; document.getElementById('btn-xray').setAttribute('aria-pressed', String(on));
  paint(); syncPins();
}
function setSpin(on) { state.spin = on; document.getElementById('btn-spin').setAttribute('aria-pressed', String(on)); }

var detail = document.getElementById('detail'), list = document.getElementById('parts');
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function renderDetail() {
  var id = state.selected;
  if (!id) {
    detail.innerHTML = '<p class="kicker">Explore</p><h2>Pick a part</h2>' +
      '<p class="lead">Click any part of the reel or choose one below and the camera flies in.</p>' +
      '<p>Scroll or pinch to zoom toward the pointer. Drag to orbit. Right-drag or two-finger drag to pan.</p>';
  } else {
    var d = INFO[id];
    detail.innerHTML = '<p class="kicker">' + esc(d.role) + '</p><h2>' + esc(d.name) + '</h2><p class="lead">' + esc(d.text) + '</p>' +
      '<dl class="facts">' + d.facts.map(function (f) { return '<dt>' + esc(f[0]) + '</dt><dd>' + esc(f[1]) + '</dd>'; }).join('') + '</dl>';
  }
  detail.scrollTop = 0;
  Array.prototype.forEach.call(list.querySelectorAll('.part'), function (b) {
    var on = b.dataset.id === id; b.setAttribute('aria-current', String(on));
    if (on && b.scrollIntoView && window.innerWidth <= 760) b.scrollIntoView({ block: 'nearest', inline: 'center' });
  });
}
function select(id) {
  state.selected = id;
  if (id) {
    if (INFO[id].internal && !state.xray) setXray(true);
    if (id === 'roller' || id === 'bail') setSpin(false);
    flyTo(id);
  }
  paint(); renderDetail(); syncPins(); resizeSoon();
}

// Parts list and pins
var pinsEl = document.getElementById('pins'), pinEls = {};
(function buildLists() {
  var html = '';
  ORDER.forEach(function (id, i) {
    if (i === 0) html += '<li class="group">Outside</li>';
    if (id === 'gear') html += '<li class="group">Inside (X-ray)</li>';
    html += '<li><button class="part" type="button" data-id="' + id + '" aria-current="false"><span class="n">' + (i + 1) + '</span><span class="name">' + esc(INFO[id].name) + '</span></button></li>';
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'pin'; b.textContent = String(i + 1); b.dataset.id = id;
    b.setAttribute('aria-label', INFO[id].name); b.title = INFO[id].name; b.tabIndex = -1;
    pinsEl.appendChild(b); pinEls[id] = b;
  });
  list.innerHTML = html;
})();
list.addEventListener('click', function (e) { var b = e.target.closest('.part'); if (b) select(b.dataset.id); });
pinsEl.addEventListener('click', function (e) { var b = e.target.closest('.pin'); if (b) select(b.dataset.id); });
function syncPins() {
  ORDER.forEach(function (id) {
    pinEls[id].hidden = !state.pins || (P[id].internal && !state.xray);
    pinEls[id].classList.toggle('is-selected', id === state.selected);
  });
}
var occIndex = 0, occRay = new T.Raycaster();
function updatePins() {
  if (!state.pins) return;
  ORDER.forEach(function (id) {
    var el = pinEls[id]; if (el.hidden) return;
    P[id].anchor.getWorldPosition(v3); v3.project(camera);
    if (v3.z > 1 || v3.z < -1) { el.style.transform = 'translate(-999px,-999px)'; return; }
    el.style.transform = 'translate(' + ((v3.x * 0.5 + 0.5) * view.w).toFixed(1) + 'px,' + ((-v3.y * 0.5 + 0.5) * view.h).toFixed(1) + 'px)';
  });
  // one occlusion test per frame, round robin
  var id = ORDER[occIndex++ % ORDER.length], el = pinEls[id];
  if (el.hidden) return;
  P[id].anchor.getWorldPosition(v3);
  var dist = v3.distanceTo(camera.position);
  occRay.set(camera.position, v3.sub(camera.position).normalize());
  var hits = occRay.intersectObjects(pickables, false), hidden = false;
  for (var i = 0; i < hits.length; i++) {
    if (!visiblePick(hits[i].object)) continue;
    hidden = hits[i].distance < dist - 0.35 && hits[i].object.userData.part !== id;
    break;
  }
  el.classList.toggle('is-occluded', hidden);
}

// Pointer orbit / pan / pinch, click to select
var pointers = new Map(), drag = null, tip = document.getElementById('tip');
function pan(dx, dy) {
  var k = 2 * cur.r * Math.tan(camera.fov * Math.PI / 360) / view.h;
  var e = camera.matrixWorld.elements;
  goal.target.x += (-dx * e[0] + dy * e[4]) * k; goal.target.y += (-dx * e[1] + dy * e[5]) * k; goal.target.z += (-dx * e[2] + dy * e[6]) * k;
}
function zoom(factor, clientX, clientY) {
  var nr = Math.max(R_MIN, Math.min(R_MAX, goal.r * factor)), f = nr / goal.r;
  if (f < 1) { var hit = pickAt(clientX, clientY); if (hit) goal.target.lerp(hit.point, 1 - f); }
  else if (f > 1) goal.target.lerp(home.target, Math.min(1, (f - 1) * 0.6));
  goal.r = nr;
}
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
canvas.addEventListener('pointerdown', function (e) {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  drag = { x0: e.clientX, y0: e.clientY, moved: 0, pan: e.button === 2 || e.button === 1 || e.shiftKey, t: performance.now(), multi: pointers.size > 1 };
  canvas.classList.add('is-dragging'); tip.hidden = true;
});
canvas.addEventListener('pointermove', function (e) {
  var p = pointers.get(e.pointerId);
  if (!p) { hover(e); return; }
  var dx = e.clientX - p.x, dy = e.clientY - p.y;
  if (pointers.size === 2) {
    var other; pointers.forEach(function (q, id) { if (id !== e.pointerId) other = q; });
    var d0 = Math.hypot(p.x - other.x, p.y - other.y), d1 = Math.hypot(e.clientX - other.x, e.clientY - other.y);
    if (d0 > 0 && d1 > 0) zoom(d0 / d1, (e.clientX + other.x) / 2, (e.clientY + other.y) / 2);
    pan(dx / 2, dy / 2);
    if (drag) drag.multi = true;
  } else if (drag && drag.pan) {
    pan(dx, dy);
  } else {
    goal.theta -= dx * 0.0085;
    goal.phi = Math.max(0.08, Math.min(Math.PI - 0.08, goal.phi - dy * 0.0085));
  }
  if (drag) drag.moved += Math.abs(dx) + Math.abs(dy);
  p.x = e.clientX; p.y = e.clientY;
});
function release(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    canvas.classList.remove('is-dragging');
    if (drag && !drag.multi && drag.moved < 7 && performance.now() - drag.t < 600 && e.type === 'pointerup') {
      var hit = pickAt(e.clientX, e.clientY);
      if (hit) select(hit.object.userData.part);
    }
    drag = null;
  }
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('pointerleave', function () { if (state.hover) { state.hover = null; paint(); } tip.hidden = true; canvas.classList.remove('is-over'); });
canvas.addEventListener('wheel', function (e) {
  e.preventDefault();
  var dy = e.deltaY * (e.deltaMode === 1 ? 32 : 1);
  zoom(Math.exp(Math.max(-240, Math.min(240, dy)) * 0.0016), e.clientX, e.clientY);
}, { passive: false });
canvas.addEventListener('dblclick', function (e) { if (!pickAt(e.clientX, e.clientY)) { select(null); goHome(); } });
var hoverAt = 0;
function hover(e) {
  if (e.pointerType !== 'mouse') return;
  var now = performance.now(); if (now - hoverAt < 40) return; hoverAt = now;
  var hit = pickAt(e.clientX, e.clientY), id = hit ? hit.object.userData.part : null;
  if (id !== state.hover) { state.hover = id; paint(); canvas.classList.toggle('is-over', !!id); }
  if (id) {
    var r = app.getBoundingClientRect();
    tip.textContent = INFO[id].name; tip.hidden = false;
    tip.style.transform = 'translate(' + (e.clientX - r.left + 14) + 'px,' + (e.clientY - r.top + 16) + 'px)';
  } else tip.hidden = true;
}

// Controls
document.getElementById('btn-home').addEventListener('click', function () { select(null); goHome(); });
document.getElementById('btn-spin').addEventListener('click', function () { setSpin(!state.spin); });
document.getElementById('btn-xray').addEventListener('click', function () { setXray(!state.xray); });
document.getElementById('btn-pins').addEventListener('click', function (e) {
  state.pins = !state.pins; e.currentTarget.setAttribute('aria-pressed', String(state.pins)); syncPins();
});
document.getElementById('explode').addEventListener('input', function (e) {
  state.explode = e.target.value / 100; applyExplode();
  if (!state.selected) { computeHome(); goal.target.copy(home.target); goal.r = home.r; }
});
function applyExplode() {
  var t = state.explode; t = t * t * (3 - 2 * t);
  ORDER.forEach(function (id) { var p = P[id]; p.g.position.copy(p.base).addScaledVector(p.ex, t); });
  root.updateMatrixWorld(true);
}
function pose() {
  var a = state.angle;
  handleSpin.rotation.z = HANDLE_REST - a; gearSpin.rotation.z = -a;
  rotorSpin.rotation.x = ROTOR_REST + a * 5.7; pinionSpin.rotation.x = a * 5.7;
  osc.position.x = Math.sin(a * 0.55) * 0.62;
}

var resizeQueued = false;
function resizeSoon() { if (resizeQueued) return; resizeQueued = true; requestAnimationFrame(function () { resizeQueued = false; resize(); }); }
window.addEventListener('resize', function () { resize(); if (!state.selected) { computeHome(); goal.r = home.r; goal.target.copy(home.target); } });

/* ------------------------------------------------------------------ loop */
var last = performance.now();
function frame(now) {
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state.spin) { state.angle += dt * Math.PI * 2 * 0.3; pose(); }
  var k = reduceMotion ? 1 : 1 - Math.exp(-dt * 7);
  cur.target.lerp(goal.target, k);
  cur.r += (goal.r - cur.r) * k; cur.theta += (goal.theta - cur.theta) * k; cur.phi += (goal.phi - cur.phi) * k;
  applyCamera();
  renderer.render(scene, camera);
  updatePins();
  requestAnimationFrame(frame);
}

pose(); applyExplode(); renderDetail(); syncPins(); paint();
resize(); goHome(true); applyCamera();
requestAnimationFrame(frame);
window.__reel = { select: select, state: state, setXray: setXray, snap: snap };
})();
</script>
